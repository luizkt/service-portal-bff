spring:
  security:
    oauth2:
      resourceserver:
        jwt:
          # Todos os providers de uma instância Authentik compartilham a mesma chave de assinatura RSA.
          # Qualquer endpoint /jwks/ de um provider válido pode ser usado para validar tokens de todos os providers.
          jwk-set-uri: ${AUTHENTIK_JWKS_URI:http://authentik-server:9000/application/o/service-portal/jwks/}

bff:
  orchestrator:
    base-url: ${ORCHESTRATOR_URL:http://orchestrator:8080}
    username: ${ORCHESTRATOR_USERNAME:admin}
    password: ${ORCHESTRATOR_PASSWORD:admin}
  manager:
    base-url: ${MANAGER_URL:http://manager:8082}
    username: ${MANAGER_USERNAME:admin}
    password: ${MANAGER_PASSWORD:admin}
  auth:
    issuer-uri: ${AUTHENTIK_ISSUER_URI:http://localhost:9000/application/o/service-portal/}
    allowed-issuers: "${AUTHENTIK_ISSUER_URI:http://localhost:9000/application/o/service-portal/},${AUTHENTIK_M2M_ISSUER_URI:http://localhost:9000/application/o/service-portal-m2m/}"
    client-id: ${AUTHENTIK_CLIENT_ID:service-portal-spa}
    scopes:
      - openid
      - profile
      - email
      - groups

logging:
  level:
    root: INFO
    com.serviceportal.bff: INFO
