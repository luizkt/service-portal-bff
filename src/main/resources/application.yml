spring:
  application:
    name: service-portal-bff
  jackson:
    serialization:
      write-dates-as-timestamps: false
  boot:
    admin:
      client:
        url: ${SPRING_BOOT_ADMIN_URL:http://localhost:8085}
        username: ${SBA_USERNAME:admin}
        password: ${SBA_PASSWORD:admin}
  security:
    oauth2:
      resourceserver:
        jwt:
          # URL interna: acessada pelo container BFF via DNS do Docker
          jwk-set-uri: ${AUTHENTIK_JWKS_URI:http://localhost:9000/application/o/service-portal/jwks/}

server:
  port: ${SERVER_PORT:8081}

bff:
  orchestrator:
    # Apenas execução de fluxos — POST /api/orchestrate/{version}/{flowId}
    base-url: ${ORCHESTRATOR_URL:http://localhost:8080}
    username: ${ORCHESTRATOR_USERNAME:admin}
    password: ${ORCHESTRATOR_PASSWORD:admin}
    # Timeout de resposta (ms); execução de fluxos pode demorar mais que o CRUD
    timeout-ms: ${ORCHESTRATOR_TIMEOUT_MS:30000}
  manager:
    # CRUD de fluxos — service-portal-manager
    base-url: ${MANAGER_URL:http://localhost:8082}
    username: ${MANAGER_USERNAME:admin}
    password: ${MANAGER_PASSWORD:admin}
    # Timeout de resposta (ms) do CRUD
    timeout-ms: ${MANAGER_TIMEOUT_MS:10000}
  http:
    # Timeout de conexão TCP (ms) para todos os backends
    connect-timeout-ms: ${BFF_HTTP_CONNECT_TIMEOUT_MS:2000}
  auth:
    # URL pública do issuer SPA (claim "iss" dos tokens PKCE do frontend)
    issuer-uri: ${AUTHENTIK_ISSUER_URI:http://localhost:9000/application/o/service-portal/}
    # Lista de issuers aceitos (separados por vírgula) — inclui SPA + M2M para testes
    allowed-issuers: "${AUTHENTIK_ISSUER_URI:http://localhost:9000/application/o/service-portal/},${AUTHENTIK_M2M_ISSUER_URI:http://localhost:9000/application/o/service-portal-m2m/}"
    # Client ID público da SPA cadastrado no Authentik (provider OAuth2/OIDC)
    client-id: ${AUTHENTIK_CLIENT_ID:service-portal-spa}
    # Scopes que o frontend solicita no /authorize
    scopes:
      - openid
      - profile
      - email
      - groups
    # URL interna do Authentik para o BFF autenticar usuários via Flow Executor
    authentik-base-url: ${AUTHENTIK_BASE_URL:http://localhost:9000}

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus,threaddump,heapdump,loggers,env,beans,caches
  endpoint:
    health:
      show-details: always
      probes:
        enabled: true
  tracing:
    sampling:
      probability: 1.0
  otlp:
    tracing:
      endpoint: ${OTEL_EXPORTER_OTLP_ENDPOINT:http://localhost:4318}/v1/traces
  metrics:
    distribution:
      percentiles-histogram:
        http.server.requests: true
    web:
      server:
        request:
          ignore-patterns:
            - /actuator/health
            - /actuator/prometheus

springdoc:
  swagger-ui:
    path: /swagger-ui.html
  api-docs:
    path: /v3/api-docs
  use-fn-routes: false

logging:
  level:
    com.serviceportal.bff: DEBUG
